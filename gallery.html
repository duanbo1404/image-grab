<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品图片库</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-left">
        <h1 class="title">商品图片库</h1>
        <p class="subtitle" id="pageMeta">加载中…</p>
      </div>
      <div class="toolbar-actions">
        <label class="check-all">
          <input type="checkbox" id="selectAll" />
          <span>全选</span>
        </label>
        <button type="button" class="btn btn-ghost" id="btnInvert">反选</button>
        <span class="selected-count" id="selectedCount">已选 0 / 0</span>
        <button type="button" class="btn btn-primary" id="btnDownload" disabled>
          下载选中
        </button>
      </div>
    </header>

    <main>
      <div id="emptyState" class="empty hidden">
        <p>暂无图片数据。请在商品详情页点击「获取图片」。</p>
      </div>
      <div id="grid" class="grid" aria-live="polite"></div>
    </main>

    <!-- 下载进度遮罩 -->
    <div id="progressOverlay" class="overlay hidden" role="status" aria-live="assertive">
      <div class="progress-card">
        <h2 id="progressTitle">正在下载…</h2>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">0 / 0</p>
      </div>
    </div>

    <script src="gallery.js"></script>
  </body>
</html>
